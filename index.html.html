<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC-Components Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .category-btn.active {
            background-color: #212529 !important;
            color: #fff !important;
            border-color: #212529 !important;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">💻 PC-Master</a>
            <button class="btn btn-primary position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
                🛒 Корзина
                <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </button>
        </div>
    </nav>

    <div class="container-fluid my-5 px-4">
        <div class="row g-4">
            
            <div class="col-12 col-xl-3">
                <div class="card shadow-sm p-4 sticky-xl-top" style="top: 90px; z-index: 100;">
                    <h5 class="fw-bold mb-3">📁 Категории</h5>
                    <div class="d-grid gap-2 mb-4">
                        <button class="btn btn-outline-secondary text-start category-btn active" onclick="filterCategory('all', this)">Все товары</button>
                        <button class="btn btn-outline-secondary text-start category-btn" onclick="filterCategory('cpu', this)">Процессоры</button>
                        <button class="btn btn-outline-secondary text-start category-btn" onclick="filterCategory('gpu', this)">Видеокарты</button>
                        <button class="btn btn-outline-secondary text-start category-btn" onclick="filterCategory('monitor', this)">Мониторы</button>
                        <button class="btn btn-outline-secondary text-start category-btn" onclick="filterCategory('phone', this)">Смартфоны</button>
                    </div>

                    <h5 class="fw-bold mb-3">💰 Бюджет</h5>
                    <div class="d-grid gap-2 mb-4">
                        <button class="btn btn-sm btn-outline-primary text-start" onclick="filterPrice('all')">Любая цена</button>
                        <button class="btn btn-sm btn-outline-primary text-start" onclick="filterPrice('budget')">До 15 000 грн</button>
                        <button class="btn btn-sm btn-outline-primary text-start" onclick="filterPrice('top')">От 15 000 грн</button>
                    </div>

                    <h5 class="fw-bold mb-2">📦 Статус</h5>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="stockSwitch" checked disabled>
                        <label class="form-check-label text-success small" for="stockSwitch">Только в наличии (100%)</label>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-8 col-xl-6">
                <h2 class="mb-4 fw-bold text-center text-md-start">Каталог комплектующих</h2>
                <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3" id="products-grid">
                    </div>
            </div>

            <div class="col-12 col-md-4 col-xl-3">
                <div class="card shadow-sm p-4 sticky-xl-top" style="top: 90px; z-index: 100;">
                    <h5 class="fw-bold mb-3 text-primary">⭐ Почему мы?</h5>
                    <ul class="list-unstyled mb-4">
                        <li class="mb-2">🚀 Быстрая доставка по Украине</li>
                        <li class="mb-2">🛡️ Официальная гарантия 24-36 мес.</li>
                        <li class="mb-2">
